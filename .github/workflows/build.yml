name: build

permissions:
  contents: read
  actions: write
  pull-requests: write

on:
  pull_request:
    paths-ignore:
      - docs/**
  push:
    paths-ignore:
      - docs/**

jobs:
  build:

    runs-on: windows-latest

    env:
      DOTNET_NOLOGO: true

    steps:
    - uses: actions/checkout@v2
      with:
        fetch-depth: 0

    - name: Setup .NET SDKs
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: |
          2.1.x
          3.1.x
          6.0.x

    - name: Run NUKE
      run: ./build.ps1
      env:
        BranchSpec: ${{ github.ref }}
        BuildNumber: ${{ github.run_number }}
        ApiKey: ${{ secrets.NUGETAPIKEY }}

    - name: Report code coverage
      uses: k1LoW/octocov-action@v1

    - name: Upload artifacts
      uses: actions/upload-artifact@v2
      with:
        path: ./Artifacts/*
